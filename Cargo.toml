[package]
name = "nirikit"
version = "0.1.0"
edition = "2021"
description = "Launch applications on niri workspaces"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

